# Loopback only. Tailscale Funnel exposes just these consumer-safe documents.
server {
    listen 127.0.0.1:8798;
    server_name _;
    root /var/www/tockett-status;
    access_log off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    location = /status.json { limit_except GET { deny all; } }
    location = /history.json { limit_except GET { deny all; } }
    location / { return 404; }
}
