name: Publish service status
on:
  push:
    branches: [main]
    paths-ignore: [state.json]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-service-status
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Check status transitions
        run: python3 -m unittest discover -s tests -v
      - name: Observe and build status
        run: python3 collect.py
      - name: Preserve observation and event history
        run: |
          git config user.name 'Tockett status publisher'
          git config user.email 'status-publisher@users.noreply.github.com'
          git add state.json
          git diff --cached --quiet || git commit -m 'Update service status observation'
          git push origin HEAD:main
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
